name: Build Battery Guardian OTA

on:
  push:
    paths:
      - 'source/bg208_min.zip'
      - 'source/trigger-v208.txt'
      - '.github/workflows/build-ota.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Extract source
        run: |
          rm -rf work
          mkdir -p work
          unzip -q source/bg208_min.zip -d work

      - name: Build signed release APK
        working-directory: work
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish OTA files
        shell: bash
        run: |
          set -e
          mkdir -p apk
          cp work/app/build/outputs/apk/release/app-release.apk apk/Battery_Guardian_2_v2.0.8.apk
          SHA=$(sha256sum apk/Battery_Guardian_2_v2.0.8.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionCode": 20008,
            "versionName": "2.0.8",
            "title": "Battery Guardian 2 v2.0.8 업데이트",
            "notes": [
              "백그라운드 제한을 명령 실행 후 실제 상태까지 다시 확인",
              "권한 거부/명령 미지원/Shizuku 오류 등 실패 원인을 상세 표시",
              "자동 실험 종료 후 테스트 완료 상태와 결과를 확인할 때까지 유지"
            ],
            "apkUrl": "https://raw.githubusercontent.com/juhaniking123-ux/Battery-Guardian-2-update/main/apk/Battery_Guardian_2_v2.0.8.apk",
            "sha256": "$SHA",
            "rulesUrl": ""
          }
          EOF
          git config user.name "battery-guardian-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apk/Battery_Guardian_2_v2.0.8.apk update.json
          git commit -m "Publish Battery Guardian 2 v2.0.8 OTA" || exit 0
          git pull --rebase origin main
          git push
