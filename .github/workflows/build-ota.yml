name: Build Battery Guardian OTA

on:
  push:
    paths:
      - 'source/bg2010_min.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Extract source
        run: |
          rm -rf work
          mkdir -p work
          unzip -q source/bg2010_min.zip -d work

      - name: Build signed release APK
        working-directory: work
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish OTA files
        shell: bash
        run: |
          set -e
          mkdir -p apk
          cp work/app/build/outputs/apk/release/app-release.apk apk/Battery_Guardian_2_v2.0.11.apk
          SHA=$(sha256sum apk/Battery_Guardian_2_v2.0.11.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionCode": 20011,
            "versionName": "2.0.11",
            "title": "Battery Guardian 2 v2.0.11 업데이트",
            "notes": [
              "Guardian 적용 설정 전체 원상복구 기능 추가",
              "1시간 화면 OFF 대기 테스트와 시간당 배터리 소모율 표시",
              "카카오톡 등 알림 필수 앱 보호 유지",
              "7일 학습 데이터와 기존 설정 유지"
            ],
            "apkUrl": "https://raw.githubusercontent.com/juhaniking123-ux/Battery-Guardian-2-update/main/apk/Battery_Guardian_2_v2.0.11.apk",
            "sha256": "$SHA",
            "rulesUrl": ""
          }
          EOF
          git config user.name "battery-guardian-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apk/Battery_Guardian_2_v2.0.11.apk update.json
          git commit -m "Publish Battery Guardian 2 v2.0.11 OTA" || exit 0
          git pull --rebase origin main
          git push
