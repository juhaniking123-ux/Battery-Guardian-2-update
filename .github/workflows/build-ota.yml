name: Build Battery Guardian OTA

on:
  push:
    paths:
      - 'source/bg2010_min.zip'
      - 'source/trigger-v2010.txt'
      - '.github/workflows/build-ota.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Extract source
        run: |
          rm -rf work
          mkdir -p work
          unzip -q source/bg2010_min.zip -d work

      - name: Build signed release APK
        working-directory: work
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Publish OTA files
        shell: bash
        run: |
          set -e
          mkdir -p apk
          cp work/app/build/outputs/apk/release/app-release.apk apk/Battery_Guardian_2_v2.0.10.apk
          SHA=$(sha256sum apk/Battery_Guardian_2_v2.0.10.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionCode": 20010,
            "versionName": "2.0.10",
            "title": "Battery Guardian 2 v2.0.10 업데이트",
            "notes": [
              "화면이 꺼졌을 때 카카오톡 알림이 막히지 않도록 알림 필수 앱 제한 자동 복구",
              "카카오톡·Google Play 서비스·삼성 Push 등 알림 핵심 앱을 영구 보호 대상에 추가",
              "이전 버전에서 남은 Standby/AppOps/Wake Lock 제한을 업데이트 후 자동 해제",
              "7일 학습 진행률 및 지속 학습 표시는 그대로 유지"
            ],
            "apkUrl": "https://raw.githubusercontent.com/juhaniking123-ux/Battery-Guardian-2-update/main/apk/Battery_Guardian_2_v2.0.10.apk",
            "sha256": "$SHA",
            "rulesUrl": ""
          }
          EOF
          git config user.name "battery-guardian-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apk/Battery_Guardian_2_v2.0.10.apk update.json
          git commit -m "Publish Battery Guardian 2 v2.0.10 OTA" || exit 0
          git pull --rebase origin main
          git push
