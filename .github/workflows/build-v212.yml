name: Build Battery Guardian 2 v2.0.12

on:
  push:
    paths:
      - 'patches/v212.py'
      - '.github/workflows/build-v212.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: battery-guardian-v212
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Apply v2.0.12 battery and heat patch
        run: |
          unzip -q source/bg2010_min.zip -d work
          python3 patches/v212.py work
      - name: Build signed release APK
        run: gradle -p work :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s work/app/build/outputs/apk/release/app-release.apk
          unzip -t work/app/build/outputs/apk/release/app-release.apk | tail -1
      - name: Publish after successful build
        run: |
          set -e
          cp work/app/build/outputs/apk/release/app-release.apk apk/Battery_Guardian_2_v2.0.12.apk
          SHA=$(sha256sum apk/Battery_Guardian_2_v2.0.12.apk | awk '{print $1}')
          cat > update.json <<EOF
          {
            "versionCode": 20012,
            "versionName": "2.0.12",
            "title": "Battery Guardian 2 v2.0.12 발열/대기 최적화",
            "notes": [
              "5분마다 실행되던 알림 앱 설정 변경 명령 제거",
              "백그라운드 자동 관리를 충전 중 휴대폰 대기 시 작업으로 변경",
              "7일 관찰 완료와 절감 효과 측정 상태를 정확하게 구분",
              "기존 설정, 앱 보호 목록, 실험 기록 유지"
            ],
            "apkUrl": "https://raw.githubusercontent.com/juhaniking123-ux/Battery-Guardian-2-update/main/apk/Battery_Guardian_2_v2.0.12.apk",
            "sha256": "$SHA",
            "rulesUrl": ""
          }
          EOF
          git config user.name battery-guardian-bot
          git config user.email actions@users.noreply.github.com
          git add apk/Battery_Guardian_2_v2.0.12.apk update.json
          git commit -m "Publish Battery Guardian 2 v2.0.12 battery fix"
          git pull --rebase origin main
          git push origin main
