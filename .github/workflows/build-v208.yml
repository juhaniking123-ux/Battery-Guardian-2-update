name: Build Battery Guardian v2.0.8

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v208.yml'
      - 'ci/v208/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat \
            ci/v208/source.part00 \
            ci/v208/source.part01 \
            ci/v208/source.part02 \
            ci/v208/source.part03a \
            ci/v208/source.part03b \
            ci/v208/source.part03c0 \
            ci/v208/source.part03c1 \
            ci/v208/source.part03c20 \
            ci/v208/source.part03c211 \
            ci/v208/source.part04a \
            ci/v208/source.part04b \
            ci/v208/source.part04c \
            > /tmp/bg208.b64
          tr -d '[:space:]' < /tmp/bg208.b64 | base64 -d > /tmp/bg208.zip
          unzip -t /tmp/bg208.zip
          mkdir -p /tmp/work
          unzip -q /tmp/bg208.zip -d /tmp/work
          test -f /tmp/work/bg208_ci/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        working-directory: /tmp/work/bg208_ci
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect output
        shell: bash
        run: |
          mkdir -p /tmp/out
          APK=$(find /tmp/work/bg208_ci/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" /tmp/out/Battery_Guardian_2_v2.0.8-unsigned.apk
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          cp "$BT/lib/apksigner.jar" /tmp/out/apksigner.jar
          ls -lh /tmp/out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bg208-build
          path: /tmp/out/*
          retention-days: 1
