name: Build Battery Guardian 2 v2.0.8

on:
  push:
    paths:
      - 'source/v208.zip'
      - '.github/workflows/build-v208.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract source
        run: unzip -q source/v208.zip
      - name: Build unsigned release APK
        run: gradle -p bg208_ci --no-daemon clean assembleRelease
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Battery_Guardian_2_v2.0.8_unsigned
          path: bg208_ci/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
